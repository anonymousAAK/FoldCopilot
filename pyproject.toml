[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foldcopilot"
version = "0.1.0"
description = "Confidence-aware interpretation copilot for protein structure predictions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Adarsh" },
]
keywords = ["mcp", "alphafold", "protein", "structure", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
tasks = [
    "fastmcp[tasks]",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
]

[project.scripts]
foldcopilot = "foldcopilot.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foldcopilot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
